---
name: Backport merged pull request

on:  # yamllint disable-line rule:truthy
  pull_request_target:
    types: [closed, labeled]

jobs:
  backport:
    name: Backport pull request
    runs-on: ubuntu-slim
    # Only run on merged PRs with a backport label (default `label_pattern`)
    if: >
      github.event.pull_request.merged &&
      contains(toJSON(github.event.pull_request.labels.*.name), '"backport ')
    steps:
      - name: Get Github App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.FFMUC_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Clone Firmware
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Token for git actions, e.g. git push
          token: ${{ steps.app-token.outputs.token }}

      - name: Create backport pull requests
        uses: korthout/backport-action@66065406958f46e82238fd59546f5a99e69e22aa # v4.5.2
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          auto_merge_enabled: true
          add_author_as_reviewer: true
          comment_style: summary
          experimental: >
            {
              "conflict_resolution": "draft_commit_conflicts"
            }
