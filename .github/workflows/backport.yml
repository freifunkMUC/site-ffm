---
name: Backport merged pull request

on:  # yamllint disable-line rule:truthy
  pull_request_target:
    types: [closed, labeled]

jobs:
  backport:
    name: Backport pull request
    runs-on: ubuntu-slim
    # Only run on merged PRs with a backport label (default `label_pattern`)
    if: >
      github.event.pull_request.merged &&
      contains(toJSON(github.event.pull_request.labels.*.name), '"backport ')
    steps:
      - name: Get Github App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.FFMUC_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Clone Firmware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Token for git actions, e.g. git push
          token: ${{ steps.app-token.outputs.token }}

      - name: Create backport pull requests
        uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7 # v4.7.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          auto_merge_enabled: true
          add_author_as_reviewer: true
          comment_style: summary
          cherry_picking_merge_mode: whitespace_tolerant
          experimental: >
            {
              "conflict_resolution": "draft_commit_conflicts"
            }
