---
name: Shell Linting

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - 'gluon-*'  # gluon-next and gluon-v202a.1.x
      - '!gluon-v2021.1.x'  # shell code is not maintained on this branch
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  shellcheck:
    name: runner / shellcheck
    runs-on: ubuntu-slim
    steps:
      - name: Clone Firmware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        # Make sure the action is pinned to a commit, as all reviewdog repos
        # have hundreds of contributors with write access (breaks easy/often)
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427  # v1.34.1
        with:
          filter_mode: "file"
          fail_on_error: true
