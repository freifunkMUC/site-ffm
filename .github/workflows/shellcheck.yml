---
name: Shell Linting

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - 'gluon-*'  # gluon-next and gluon-v202a.1.x
      - '!gluon-v2021.1.x'  # shell code is not maintained on this branch
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  shellcheck:
    name: runner / shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone Firmware
        uses: actions/checkout@v4 # v4
      - name: shellcheck
        # Make sure the action is pinned to a commit, as all reviewdog repos
        # have hundreds of contributors with write access (breaks easy/often)
        uses: reviewdog/action-shellcheck@6e0e63d1750d02d761b3df0f2c5ba9f9ac4a9ed7  # v1.29.0
        with:
          filter_mode: "file"
          fail_on_error: true
